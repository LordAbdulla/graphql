<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%234c8dff'/><path d='M4 11.5V8m4 3.5V5m4 6.5V9' stroke='white' stroke-width='1.8' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <noscript>
    <p class="error noscript">This profile is rendered in the browser, so JavaScript must be enabled.</p>
  </noscript>

  <section id="login-view" class="view centered" hidden>
    <form id="login-form" class="card login-card" novalidate>
      <h1 class="login-title">Sign in</h1>
      <p class="login-sub">Use your username or email</p>

      <label class="field">
        <span class="field-label">Username or email</span>
        <input id="identifier" type="text" autocomplete="username" required autofocus>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>

      <p id="login-error" class="error" role="alert" aria-live="polite" hidden></p>

      <button id="login-submit" type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </section>

  <section id="profile-view" class="view" hidden>
    <header class="topbar">
      <div class="identity">
        <div id="avatar" class="avatar" aria-hidden="true"></div>
        <div>
          <h1 id="profile-name" class="topbar-title">&nbsp;</h1>
          <p id="profile-login" class="topbar-sub">&nbsp;</p>
        </div>
      </div>
      <button id="logout-btn" type="button" class="btn btn-ghost">Log out</button>
    </header>

    <main class="content">
      <p id="profile-error" class="error" role="alert" aria-live="polite" hidden></p>

      <div id="stat-cards" class="stats"></div>

      <section class="section" aria-labelledby="stats-heading">
        <h2 id="stats-heading" class="section-title">Statistics</h2>

        <figure class="card chart-card">
          <figcaption>
            <h3 class="card-title">XP over time</h3>
            <p class="muted">Cumulative XP earned across the cursus.</p>
          </figcaption>
          <div id="chart-xp" class="chart-slot"></div>
        </figure>

        <figure class="card chart-card">
          <figcaption>
            <h3 class="card-title">XP by project</h3>
            <p class="muted">Your ten highest-scoring projects.</p>
          </figcaption>
          <div id="chart-projects" class="chart-slot"></div>
        </figure>

        <figure class="card chart-card">
          <figcaption>
            <h3 class="card-title">Audit ratio</h3>
            <p class="muted">Audit points given to others against points received.</p>
          </figcaption>
          <div id="chart-audits" class="chart-slot"></div>
        </figure>
      </section>

      <section class="section" aria-labelledby="details-heading">
        <h2 id="details-heading" class="section-title">Details</h2>
        <div class="grid-2">
          <div class="card">
            <h3 class="card-title">Profile</h3>
            <p class="muted">Basic identification from the user table.</p>
            <dl id="identity-list" class="kv"></dl>
          </div>

          <div class="card">
            <h3 class="card-title">Audits</h3>
            <p class="muted">Points given to and received from other students.</p>
            <dl id="audit-list" class="kv"></dl>
          </div>
        </div>
      </section>
    </main>
  </section>

  <div id="loader" class="loader-overlay" hidden>
    <div class="spinner" aria-label="Loading"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
